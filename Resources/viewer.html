<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src mv-local: https: http: data:; base-uri 'none'; form-action 'none'">
<style>
:root { color-scheme: light dark; --fg: #242424; --bg: #fff; --muted: #666; --line: #dedede; --code: #f5f5f5; --link: #0969da; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #e6e6e6; --bg: #1e1e1e; --muted: #aaa; --line: #414141; --code: #292929; --link: #79b8ff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 -apple-system, BlinkMacSystemFont, sans-serif; overflow-wrap: break-word; }
main { max-width: 860px; margin: auto; padding: 36px 42px 80px; }
h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.5em 0 .6em; font-weight: 650; }
h1 { font-size: 2em; } h2 { font-size: 1.5em; border-bottom: 1px solid var(--line); padding-bottom: .3em; }
main > :first-child { margin-top: 0; }
p, ul, ol, blockquote, pre, table { margin: 0 0 1em; }
li > p { margin: .4em 0; } li + li { margin-top: .25em; }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
code { background: var(--code); border-radius: 4px; padding: .15em .3em; font: .88em/1.6 ui-monospace, Menlo, monospace; }
pre { background: var(--code); padding: 16px; border-radius: 8px; overflow-x: auto; }
pre code { background: none; padding: 0; }
blockquote { border-left: 3px solid var(--line); padding-left: 1em; margin-left: 0; color: var(--muted); }
blockquote > :last-child { margin-bottom: 0; }
table { display: block; overflow-x: auto; border-collapse: collapse; }
th, td { border: 1px solid var(--line); padding: 8px 14px; }
th { background: var(--code); }
img { max-width: 100%; height: auto; } hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
input[type=checkbox] { margin-right: .5em; }
@media (max-width: 550px) { main { padding: 24px; } }
</style>
<script>/* MARKDOWN_PARSER */</script>
</head>
<body>
<main id="content" aria-label="Markdown document"></main>
<script>
const renderer = window.markdownit({ html: false, linkify: true, breaks: false });
window.renderMarkdown = function(markdown, resetScroll) {
  const y = window.scrollY;
  const content = document.getElementById('content');
  content.innerHTML = renderer.render(markdown);
  const used = new Set();
  content.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(heading => {
    const base = heading.textContent.toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
    let id = base, suffix = 0;
    while (used.has(id)) id = `${base}-${++suffix}`;
    used.add(id); heading.id = id;
  });
  // Task lists need no additional parser plugin.
  content.querySelectorAll('li').forEach(item => {
    const parent = item.firstElementChild?.tagName === 'P' ? item.firstElementChild : item;
    const node = parent.firstChild;
    if (node?.nodeType !== Node.TEXT_NODE || !/^\[[ xX]\] /.test(node.textContent)) return;
    const box = document.createElement('input'); box.type = 'checkbox'; box.disabled = true;
    box.checked = node.textContent[1].toLowerCase() === 'x';
    node.textContent = node.textContent.slice(4); parent.insertBefore(box, node);
  });
  window.scrollTo(0, resetScroll ? 0 : y);
};
// Keep anchor navigation inside the rendered page, including after reload.
document.addEventListener('click', event => {
  const link = event.target.closest('a');
  const href = link?.getAttribute('href');
  if (!href?.startsWith('#')) return;
  event.preventDefault();
  try { document.getElementById(decodeURIComponent(href.slice(1)))?.scrollIntoView(); } catch {}
});
</script>
</body>
</html>
